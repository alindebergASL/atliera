# governance-classify — classification + ceremony enforcement for the actual PR.
#
# Two SEPARATE required checks, deliberately: `classify` computes the tier and
# refuses frozen mutation; `ceremony` enforces the evidence that tier requires.
# A green `classify` never means the ceremony was satisfied.
#
# TRUST MODEL — enforcement code/config from protected base; proposal from head;
# actual review events from GitHub. Every script, schema, tier map, and identity
# allowlist that decides an outcome is taken from the protected base. Everything
# the decision is ABOUT — the diff, frozen registries, declaration, and proposed
# decision — is the candidate's. Without this, a PR editing the classifier
# is priced by its own edited classifier (reproduced: an underpricing stub
# reports Tier 0, and the protected verifier then enforces nothing at Tier 0).
# That is ordinary honest-author drift, not forgery, and it is live whenever
# this workflow is armed.
#
# Consequence, intended: a PR that legitimately improves the classifier is still
# judged by the previous, merged classifier. The new one takes effect for the
# PRs that follow it. Enforcement always lags by exactly one merge, which is
# what makes it enforcement.
#
# Adopting this file is a Tier 3 step by path pricing (a conservative review
# minimum for a file class that can do anything). Its own effect vector is
# read-only: `contents: read`, no repository write, no deployment, no
# third-party outbound or product/provider call.
name: governance-classify
on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.run.outputs.tier }}
    steps:
      # Candidate workspace: the immutable PR HEAD, never GitHub's synthetic
      # merge commit, with full history so the diff can be computed.
      - name: Check out candidate (evidence and git history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
      - name: Check out enforcement code from the protected base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: enforcement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Overlay protected enforcement code and config onto the candidate workspace
        run: |
          set -euo pipefail
          mkdir -p candidate/.atliera-enforcement
          for f in scripts/classify-pr.sh scripts/classify-change-risk.ts scripts/verify-ceremony.ts; do
            test -f "enforcement/$f" || { echo "protected base is missing $f"; exit 1; }
            cp "enforcement/$f" "candidate/$f"
          done
          cp enforcement/docs/strategy/governance-tiers.json candidate/.atliera-enforcement/governance-tiers.json
          cp enforcement/docs/strategy/decision-record.schema.json candidate/.atliera-enforcement/decision-record.schema.json
          cp enforcement/docs/strategy/decision-proposal.schema.json candidate/.atliera-enforcement/decision-proposal.schema.json
          cp enforcement/docs/strategy/governance-trust.json candidate/.atliera-enforcement/governance-trust.json
          chmod +x candidate/scripts/classify-pr.sh
          echo "enforcement bytes in use (from base ${{ github.event.pull_request.base.sha }}):"
          sha256sum candidate/scripts/classify-pr.sh candidate/scripts/classify-change-risk.ts candidate/scripts/verify-ceremony.ts
      - name: Fetch pinned base for comparison
        working-directory: candidate
        run: git fetch --no-tags origin "+${{ github.event.pull_request.base.sha }}:refs/atliera/base"
      - name: Classify PR change risk
        id: run
        working-directory: candidate
        env:
          ATL_GOVERNANCE_MAP: .atliera-enforcement/governance-tiers.json
          ATL_GOVERNANCE_CANDIDATE_MAP: docs/strategy/governance-tiers.json
        run: |
          set -o pipefail
          scripts/classify-pr.sh refs/atliera/base | tee ../classification.json
          echo "tier=$(node -e "process.stdout.write(String(require('../classification.json').prTier))")" >> "$GITHUB_OUTPUT"
      - name: Annotate PR with computed tier
        if: always()
        run: echo "::notice title=Governance tier::computed tier ${{ steps.run.outputs.tier }} for ${{ github.event.pull_request.head.sha }} (classified by protected-base enforcement code)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification
          path: classification.json

  ceremony:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate (ceremony evidence)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - name: Check out enforcement code from the protected base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: enforcement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch external GitHub review evidence
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            require('fs').writeFileSync('external-reviews.json', JSON.stringify(reviews));
      - name: Enforce ceremony for the computed tier
        working-directory: enforcement
        run: |
          set -euo pipefail
          echo "enforcement bytes in use (from base ${{ github.event.pull_request.base.sha }}):"
          sha256sum scripts/verify-ceremony.ts
          MANIFEST_ARG=""
          [ -f ../candidate/ceremony.json ] && MANIFEST_ARG="--manifest ../candidate/ceremony.json"
          DECL_ARG=""
          [ -f ../candidate/change-risk.json ] && DECL_ARG="--declaration ../candidate/change-risk.json"
          node --experimental-strip-types scripts/verify-ceremony.ts \
            --tier "${{ needs.classify.outputs.tier }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --events ../external-reviews.json \
            --trust docs/strategy/governance-trust.json \
            --proposal-schema docs/strategy/decision-proposal.schema.json \
            --repository "${{ github.repository }}" $MANIFEST_ARG $DECL_ARG
